plugins {
	id 'fabric-loom' version '1.17.19'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
}

test {
	useJUnitPlatform()
}

loom {
	runs {
		selftest {
			inherit server
			name = "Self test"
			property "structuresremover.selftest", "true"
			property "structuresremover.persist", System.getProperty("srpersist", "")
		}
		trial {
			inherit server
			name = "Detection trial"
			property "structuresremover.trial", System.getProperty("srtrial", "")
			property "structuresremover.trial.x", System.getProperty("srx", "3521")
			property "structuresremover.trial.z", System.getProperty("srz", "5922")
			property "structuresremover.trial.radius", System.getProperty("srradius", "50")
			property "structuresremover.trial.examples", System.getProperty("srexamples", "4")
			property "structuresremover.trial.box", System.getProperty("srbox", "14")
			property "structuresremover.trial.tolerance", System.getProperty("srtol", "100")
			vmArg "-Xmx6G"
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
